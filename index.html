<!DOCTYPE html>
<html lang="ms">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Pengesahan Kehadiran</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/pdf-lib/1.17.1/pdf-lib.min.js"></script>
</head>
<body class="bg-slate-100 min-h-screen flex items-center justify-center p-4">

  <div class="bg-white max-w-lg w-full rounded-2xl shadow-xl p-6 sm:p-8 space-y-6">
    <div class="text-center">
      <h1 class="text-2xl font-bold text-slate-800">Pengesahan Kehadiran</h1>
      <p class="text-sm text-slate-500 mt-1">Sila masukkan No. Kad Pengenalan anda</p>
    </div>

    <!-- Carian IC -->
    <div class="space-y-4">
      <div>
        <label class="block text-sm font-medium text-slate-700">No. Kad Pengenalan (tanpa '-')</label>
        <div class="mt-1 flex gap-2">
          <input type="text" id="inputIC" placeholder="Contoh: 850316016385" 
            class="flex-1 px-4 py-2 border rounded-lg focus:ring-2 focus:ring-blue-500 outline-none">
          <button id="btnSemak" onclick="semakIC()" 
            class="bg-blue-600 hover:bg-blue-700 text-white font-medium px-4 py-2 rounded-lg transition">
            Semak
          </button>
        </div>
      </div>
      <p id="msgStatus" class="text-sm text-center hidden"></p>
    </div>

    <!-- Paparan Maklumat Lengkap -->
    <div id="sectionMaklumat" class="hidden space-y-4 pt-4 border-t border-slate-200">
      <div class="bg-blue-50 p-4 rounded-xl space-y-3 text-sm">
        <div>
          <span class="text-xs text-slate-500 font-semibold uppercase">Nama Guru Besar:</span>
          <p id="dispNama" class="text-base font-bold text-slate-800"></p>
        </div>
        
        <div class="grid grid-cols-2 gap-2 pt-2 border-t border-blue-100">
          <div>
            <span class="text-xs text-slate-500 font-semibold uppercase">Kod Sekolah:</span>
            <p id="dispKodSekolah" class="font-medium text-slate-700"></p>
          </div>
          <div>
            <span class="text-xs text-slate-500 font-semibold uppercase">PPD:</span>
            <p id="dispPPD" class="font-medium text-slate-700"></p>
          </div>
        </div>

        <div class="pt-2 border-t border-blue-100">
          <span class="text-xs text-slate-500 font-semibold uppercase">Nama Sekolah & 校名:</span>
          <p id="dispNamaSekolah" class="font-medium text-slate-700"></p>
        </div>
      </div>

      <div>
        <label class="block text-sm font-medium text-slate-700">Alamat Emel</label>
        <input type="email" id="inputEmail" placeholder="nama@moe.gov.my" 
          class="w-full mt-1 px-4 py-2 border rounded-lg focus:ring-2 focus:ring-blue-500 outline-none" required>
      </div>

      <button id="btnHadir" onclick="hantarKehadiran()" 
        class="w-full bg-emerald-600 hover:bg-emerald-700 text-white font-semibold py-3 rounded-lg shadow-md transition">
        Sahkan Hadir
      </button>
    </div>

    <!-- Slip Kehadiran -->
    <div id="sectionSlip" class="hidden space-y-4 pt-4 border-t border-slate-200 text-center">
      <div class="p-4 bg-emerald-50 rounded-lg text-emerald-800 font-medium">
        Kehadiran telah disahkan!
        <p class="text-xs mt-1">No. Siri: <span id="dispNoSiri" class="font-mono font-bold"></span></p>
      </div>

      <button onclick="janaSlipPDF()" 
        class="w-full bg-indigo-600 hover:bg-indigo-700 text-white font-semibold py-3 rounded-lg shadow-md transition">
        📄 Muat Turun Slip Kehadiran
      </button>
    </div>
  </div>

  <script>
    // MASUKKAN URL GOOGLE APPS SCRIPT ANDA DI SINI
    const SCRIPT_URL = "https://script.google.com/macros/s/AKfycbwXYGlW0mV6scm84IVjK5b7YxF1lO_ROc_PcbLLEC041fHPZ7aB_fYCRpQ1enNZ_iqx/exec"; 
    
    let currentData = null;

    async function semakIC() {
      const ic = document.getElementById("inputIC").value.trim();
      const msg = document.getElementById("msgStatus");
      const btn = document.getElementById("btnSemak");

      if (!ic) return alert("Sila masukkan No. IC!");

      btn.disabled = true;
      btn.innerText = "Menyemak...";
      msg.className = "text-sm text-center text-slate-500";
      msg.innerText = "Mencari rekod...";
      msg.classList.remove("hidden");

      try {
        const res = await fetch(`${SCRIPT_URL}?action=cariIC&ic=${encodeURIComponent(ic)}`);
        const json = await res.json();

        if (json.success) {
          currentData = json.data;
          
          // Paparkan maklumat yang betul
          document.getElementById("dispNama").innerText = currentData.nama;
          document.getElementById("dispKodSekolah").innerText = currentData.kodSekolah;
          document.getElementById("dispPPD").innerText = currentData.ppd;
          document.getElementById("dispNamaSekolah").innerText = `${currentData.namaSekolah} (${currentData.namaCina})`;
          
          document.getElementById("sectionMaklumat").classList.remove("hidden");
          msg.classList.add("hidden");

          if (json.sudahHadir) {
            currentData.noSiri = json.noSiri;
            tunjukBahagianSlip(json.noSiri);
          }
        } else {
          msg.className = "text-sm text-center text-red-500";
          msg.innerText = json.message;
          document.getElementById("sectionMaklumat").classList.add("hidden");
          document.getElementById("sectionSlip").classList.add("hidden");
        }
      } catch (err) {
        msg.className = "text-sm text-center text-red-500";
        msg.innerText = "Ralat semasa menghubungi pelayan.";
      } finally {
        btn.disabled = false;
        btn.innerText = "Semak";
      }
    }

    async function hantarKehadiran() {
      const email = document.getElementById("inputEmail").value.trim();
      const btn = document.getElementById("btnHadir");

      if (!email) return alert("Sila masukkan emel anda.");

      btn.disabled = true;
      btn.innerText = "Menghantar...";

      try {
        const payload = {
          action: "simpanKehadiran",
          ic: currentData.ic,
          nama: currentData.nama,
          kodSekolah: currentData.kodSekolah,
          ppd: currentData.ppd,
          namaSekolah: currentData.namaSekolah,
          namaCina: currentData.namaCina,
          email: email
        };

        const res = await fetch(SCRIPT_URL, {
          method: "POST",
          body: JSON.stringify(payload)
        });
        const json = await res.json();

        if (json.success) {
          currentData.noSiri = json.noSiri;
          tunjukBahagianSlip(json.noSiri);
        } else {
          alert("Gagal: " + json.message);
        }
      } catch (err) {
        alert("Ralat semasa menyimpan kehadiran.");
      } finally {
        btn.disabled = false;
        btn.innerText = "Sahkan Hadir";
      }
    }

    function tunjukBahagianSlip(noSiri) {
      document.getElementById("dispNoSiri").innerText = noSiri;
      document.getElementById("sectionSlip").classList.remove("hidden");
      document.getElementById("sectionMaklumat").classList.add("hidden");
    }

    async function janaSlipPDF() {
      const { PDFDocument, rgb, StandardFonts } = PDFLib;

      const templateUrl = "template.png"; 
      const templateBytes = await fetch(templateUrl).then(res => res.arrayBuffer());

      const pdfDoc = await PDFDocument.create();
      const image = await pdfDoc.embedPng(templateBytes);
      const page = pdfDoc.addPage([image.width, image.height]);

      page.drawImage(image, {
        x: 0,
        y: 0,
        width: image.width,
        height: image.height,
      });

      const font = await pdfDoc.embedFont(StandardFonts.HelveticaBold);

      // Tulis Nama Guru Besar (Lajur F)
      page.drawText(currentData.nama.toUpperCase(), {
        x: 100,
        y: 450,
        size: 20,
        font: font,
        color: rgb(0.1, 0.1, 0.1),
      });

      // Tulis No Siri
      page.drawText(`No. Siri: ${currentData.noSiri}`, {
        x: 100,
        y: 410,
        size: 14,
        font: font,
        color: rgb(0.3, 0.3, 0.3),
      });

      const pdfDataUri = await pdfDoc.save();
      const blob = new Blob([pdfDataUri], { type: "application/pdf" });
      const link = document.createElement("a");
      link.href = URL.createObjectURL(blob);
      link.download = `Slip_Kehadiran_${currentData.ic}.pdf`;
      link.click();
    }
  </script>
</body>
</html>
